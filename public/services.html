<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services · {{site.name}}</title>
  <meta name="description" content="Residential, commercial, renovation, design-build and concrete services from {{site.name}}.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="services">
<!-- @header -->
<main id="main">
  <section class="page-hero">
    <div class="hero__grid" aria-hidden="true"></div>
    <div class="container">
      <p class="eyebrow">Services</p>
      <h1 class="page-hero__title">Everything it takes to build it right</h1>
      <p class="page-hero__lead">Pick one service or hand us the whole project. Either way, you get one team that answers for the result.</p>
    </div>
  </section>
  <div class="hazard hazard--thin" aria-hidden="true"></div>

  <section class="section">
    <div class="container">
      <nav class="chip-row" aria-label="Jump to service" data-service-index></nav>
      <div class="service-list" data-service-list>
        <div class="skeleton-card skeleton-card--wide"></div>
        <div class="skeleton-card skeleton-card--wide"></div>
      </div>
    </div>
  </section>
</main>
<!-- @footer -->
<script src="/js/services.js"></script>
</body>
</html>
